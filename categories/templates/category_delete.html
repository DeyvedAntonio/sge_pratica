{% extends 'base.html' %}
{% block content %}
<div class="container mt-3">
    <h3 class="display-6">Deletar Categoria</h3>
    <div class="card">
        <div class="card-body">
            <p class="card-text">
                Tem certeza de que deseja excluir a categoria <strong>{{object.name}}</strong>?
            </p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">
                    Deletar
                </button>
            </form>
        </div>
    </div>
    <a href="{% url 'category:category-list' %}" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left-circle"></i> Cancelar e Voltar para a lista de Categorias
    </a>
</div>
{% endblock %}
