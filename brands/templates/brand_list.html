{% extends 'base.html' %}

{% block title%}
SGE - Marcas
{% endblock %}

<div class="table-responsive">
    <table class="table table-striped table-borded">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody>
            {% for brand in brands %}
            <tr>
                <td>{{ brand.id }}</td>
                <td>{{ brand.name }}</td>
                <td>{{ brand.description}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
