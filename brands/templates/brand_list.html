{% extends 'base.html' %}

{% block title %}Marcas{% endblock %}

{% block content %}

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h2">Marcas</h1>
    <div class="col-md-6">
        <a href="{% url 'brand:brand-create' %}" class="btn btn-success">
            <i class="bi bi-plus">
                Nova Marca
            </i>
        </a>
    </div>
  </div>

  <table class="table table-striped table-hover table-bordered">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nome</th>
        <th scope="col">Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for brand in brands %}
        <tr>
          <td>{{ brand.id }}</td>
          <td>{{ brand.name }}</td>
          <td class="align-items-center ">
              <a href="{% url 'brand:brand-detail' brand.uuid %}" class="btn btn-outline-info btn-sm">
                <i class="bi bi-eye-fill"></i>
              </a>
              <a href="{% url 'brand:brand-update' brand.uuid %}" class="btn btn-outline-warning btn-sm">
                <i class="bi bi-pencil"></i>
              </a>
              <a href="{% url 'brand:brand-delete' brand.uuid %}" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-trash"></i>
              </a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
