{% extends 'base.html' %}

{% block title %}
Marca - Detalhes
{% endblock %}

{% block content %}
<div class="container">
    <h3 class="display-6">
        Detalhes da Marca
    </h3>
    <div class="card">
        <div class="card-body">
            <h3 class="card-title">
                {{ object.name }}
            </h3>
            <p class="card-text">
                {{ object.description }}
            </p>
        </div>
    </div>
    <div>
        <a href="{% url 'brand-list' %}"></a>
    </div>
</div>
{% endblock %}
