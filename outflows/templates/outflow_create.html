{% extends 'base.html' %}

{% block title %}
Saídas
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3 class="display-6">
        Cadastrar Saída
    </h3>
    <div class="card">
        <div class="card-body">
            <form method="post" class="form">
                {% csrf_token%}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Registrar Saída
                </button>
            </form>
        </div>
    </div>
    <a href="{% url 'outflow:outflow-list' %}" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left-circle"></i> Cancelar e Voltar
    </a>
</div>
{% endblock %}
