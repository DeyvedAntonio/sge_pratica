{% extends 'base.html' %}

{% block title %}
Saída - Detalhes
{% endblock %}

{% block content %}
<div class="container">
    <h3 class="display-6">
        Detalhes da Saída
    </h3>
    <div class="card">
        <div class="card-body">
            <h3 class="card-title">
                {{ object.product }}
            </h3>
            <p class="card-text">
                {{ object.quantity }}
            </p>
            <p class="card-text">
                {{ object.description }}
            </p>
        </div>
    </div>
    <div>
        <a href="{% url 'outflow:outflow-list' %}" class="btn btn-secondary mt-3">
            <i class="bi bi-arrow-left-circle"></i> Voltar para a lista de Marcas
        </a>
    </div>
</div>
{% endblock %}
