{% extends 'base.html' %}

{% block title %}
Fornecedor - Editar
{% endblock %}
{% block content %}
<div class="container mt-4">
    <h3 class="display-6">
        Editar Fornecedor
    </h3>
    <div class="card">
        <div class="card-body">
            <form method="post" class="form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    Salvar Fornecedor
                </button>
            </form>
        </div>
    </div>
    <a href="{% url 'suplier:suplier-list' %}" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left-circle"></i> Cancelar e voltar para a lista de fornecedores
    </a>
</div>

{% endblock %}
